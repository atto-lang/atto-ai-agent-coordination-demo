name: AI actor bootstrap boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Keep bootstrap claim synchronized with source tree
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Initial repository bootstrap.' README.md
          grep -Fq 'Implementation is introduced on a feature branch' README.md
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"
          if find . -path ./.git -prune -o -type f -name '*.ores' -print -quit | grep -q .; then
            echo 'Native actor source exists but README still claims initial bootstrap.' >&2
            exit 1
          fi
          echo 'BOOTSTRAP_BOUNDARY_PASS; actor coordination execution remains NOT_EXECUTED.'
