name: AI actor bootstrap boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Keep bootstrap claim synchronized with source tree
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'A historical guest source fixture, `src/plan_review.ores`, is present.' README.md
          grep -Fq 'Native compiler execution, exact-head guest CI, actor coordination and external provider integration remain unverified.' README.md
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"
          actual="$(git ls-files -- '*.ores' '*.atto')"
          test "$actual" = 'src/plan_review.ores'
          test -f src/plan_review.ores
          echo 'BOOTSTRAP_BOUNDARY_PASS; historical source present, actor coordination execution remains NOT_EXECUTED.'
